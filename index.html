<!DOCTYPE html>
<html>
<head>
    <title>Tableau de bord</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
</head>

<body>

<div class="menu">
    <a href="./index.html">Tableau de bord</a>
    <a href="./commande.html">Commandes</a>
    <a href="./historique.html">Historique</a>
    <a href="./graphe.html">Graphes</a>
</div>
<button onclick="sendCommande('A1')"> ON </button>
<button onclick="sendCommande('D1')"> OFF </button>
<button onclick="sendCommande('A2')"> ON </button>
<button onclick="sendCommande('D2')"> OFF </button>
<p id="status"></p>

<!-- Zone de debug -->
<div style="background: #f0f0f0; border: 1px solid #ccc; padding: 10px; margin: 10px 0; border-radius: 5px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px;">
    <strong>📊 Logs de debug:</strong>
    <div id="debug-logs" style="margin-top: 10px; color: #333;"></div>
</div>

<div class="content"> 
    <h1>Tableau de bord</h1>

    <div class="card">
        <h3>Niveau Réservoir 1</h3>
        <p id="niveau1">-- %</p>
    </div>

    <div class="card">
        <h3>Niveau Réservoir 2</h3>
        <p id="niveau2">-- %</p>
    </div>

    <div class="card">
        <h3>Notifications</h3>
        <p id="notification">Aucune</p>
    </div>
</div>

<script src="mqtt.js"></script>

</body>
</html>
